name: Sync org labels

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print changes without applying them
        type: boolean
        default: true
      prune:
        description: Delete labels that aren't in labels.yml (removes them from issues)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - labels.yml
      - scripts/sync-labels.sh
  schedule:
    - cron: "0 6 * * 1" # weekly, picks up newly created repos

permissions:
  contents: read

concurrency:
  group: sync-labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Sync labels to all repositories
        env:
          # The default GITHUB_TOKEN can't touch other repos. Use a PAT or a GitHub App token.
          GH_TOKEN: ${{ secrets.ORG_LABELS_TOKEN }}
          ORG: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          PRUNE: ${{ inputs.prune || 'false' }}
          EXCLUDE: ${{ vars.LABEL_SYNC_EXCLUDE }}
        run: ./scripts/sync-labels.sh "$ORG" labels.yml
