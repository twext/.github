name: Sync Labels Across Repositories

on:
  push:
    branches:
      - main
    paths:
      - ".github/labels.yml"
      - ".github/workflows/label-sync.yml"
  workflow_dispatch:

jobs:
  label-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync labels to public repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_NAME: twext
        run: |
          # Fetch all public, unarchived repository names
          REPOS=$(gh api --paginate "orgs/${ORG_NAME}/repos?type=public" --jq '.[] | select(.archived == false) | .name')

          for REPO in $REPOS; do
            echo "Syncing labels for public repository: ${REPO}..."
            npx github-label-sync \
              --access-token "$GH_TOKEN" \
              --labels .github/labels.yml \
              --no-allow-added-labels \
              "${ORG_NAME}/${REPO}"
          done
